[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "Capital-preservation crypto trading bot (Binance, ccxt). Backtest -> paper -> tiny live."
requires-python = ">=3.13"
dependencies = [
  "ccxt>=4.5,<5",            # RE-VERIFY Binance testnet endpoint on each bump (ccxt #27266)
  "pandas>=2.2,<3",
  "numpy>=2,<3",
  "pandas-ta-classic>=0.6",  # Py3.13-compatible TA, no TA-Lib C build needed
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "pyyaml>=6",
  "pyarrow>=16",             # parquet cache for historical bars
  "tenacity>=8.3",           # retry/backoff for exchange calls
  "httpx>=0.27",             # Telegram alerts (could use stdlib instead)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock", "freezegun", "ruff", "mypy"]

[project.scripts]
tradebot = "tradebot.main:main"

[tool.setuptools.packages.find]
include = ["tradebot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
