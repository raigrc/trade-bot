# Active config. Paper-sim = live Binance mainnet prices + simulated fills,
# virtual money, NO keys, NO real-money risk. Safe to run unattended.
# Currently FORWARD PAPER-TESTING tsmom on daily bars: walk-forward is NO-GO but
# it's the most promising candidate (cross-regime, survives 2x costs; see
# docs/strategy_gate_results.md). Stays in PAPER — confirm_live remains false
# until a strategy actually PASSES the go/no-go gate.

mode: paper
paper_execution: sim          # sim = no keys, virtual money (forward test)
confirm_live: false           # real-money gate (keep false until a gate pass)

symbols: ["BTC/USDT"]
timeframe: "1d"               # daily signal bars (forward-testing daily TSMom)
htf_timeframe: "1d"           # daily 200-SMA regime gate (== trading tf for daily)
quote_currency: "USDT"
initial_equity: 1000.0        # VIRTUAL paper equity (clean 1% sizing); adjust freely

testnet_url: "https://testnet.binance.vision"

strategy:
  name: tsmom                 # forward paper-test — see docs/strategy_gate_results.md
  params:
    lookback_days: 28         # go long when trailing 28d return > 0
    require_htf_uptrend: true # only long when daily close > daily SMA-200 (sat out 2022 bear)

risk:
  risk_fraction_per_trade: 0.01
  risk_hard_cap_per_trade: 0.02
  require_stop: true
  stop_atr_mult: 1.5
  tp_mode: atr
  trail_mode: atr
  daily_loss_limit_pct: 0.03
  max_drawdown_pct: 0.15
  kill_switch_auto_resume: false
  max_concurrent_positions: 1
  spot_only: true
  max_leverage: 1.0
  taker_fee_pct: 0.001
  slippage_pct: 0.0005
  stop_slippage_pct: 0.0020
  min_rr_after_costs: 1.0
